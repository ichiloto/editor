name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Composer, syntax, PHPStan and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Editor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Check PHP 8.4 source syntax
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPStan
        run: composer analyse -- --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

  tests:
    name: Tests (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            php: '8.4'
          - os: ubuntu-24.04
            php: '8.5'
          - os: macos-15
            php: '8.4'

    steps:
      - name: Check out Editor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pest
        run: |
          mkdir -p build/test-results
          composer test -- --log-junit build/test-results/junit.xml

      - name: Upload failed test report
        if: failure() && hashFiles('build/test-results/junit.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-${{ matrix.os }}-php-${{ matrix.php }}
          path: build/test-results/junit.xml
          if-no-files-found: ignore
